#:schema https://www.schemastore.org/treefmt.json

allow-missing-formatter = false
excludes = []

[formatter.dprint]
command = "dprint"
options = ["fmt"]
includes = ["*.kdl"]

[formatter.typos]
command = "typos"
options = ["--write-changes"]
includes = ["*"]

[formatter.biome]
command = "biome"
options = ["format", "--write"]
includes = ["*.json", "*.jsonc", "*.yaml", "*.md"]

[formatter.tombi]
command = "tombi"
options = ["format"]
includes = ["*.toml"]

[formatter.just]
command = "just"
options = ["--format", "--justfile"]
includes = ["*.just", "justfile", "**/justfile"]

[formatter.shfmt]
command = "shfmt"
options = ["--write"]
includes = ["*.sh", "*.bash", "*.tmux", "tmux.conf", "**/tmux.conf"]

[formatter.fish_indent]
command = "fish_indent"
options = ["--write"]
includes = ["*.fish", "fish_variables", "**/fish_variables"]

[formatter.nufmt]
command = "nufmt"
includes = ["*.nu", "*.nuon"]

[formatter.stylua]
command = "stylua"
includes = ["*.lua"]
