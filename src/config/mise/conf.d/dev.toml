### Languages

[settings]
npm.package_manager = "bun"
pipx.uvx = true
python.uv_venv_auto = true

[tools]
"github:numtide/treefmt" = "latest"

dprint = "latest"

shfmt = "latest"
tombi = "latest"

typos = "latest"
"github:tekumara/typos-lsp" = "latest"

just = "latest"
"github:terror/just-lsp" = "latest"

nushell = "latest"
"cargo:https://github.com/nushell/nufmt" = "latest"

zig = "latest"
zls = "latest"
clang-format = "latest"
"github:clangd/clangd" = "latest"

rust = { version = "latest", components = ["rust-analyzer", "rust-src"] }

go = "latest"
"go:golang.org/x/tools/gopls" = "latest"

lua = "latest"
stylua = "latest"
"aqua:Kampfkarren/selene" = "latest"
lua-language-server = "latest"

bun = "latest"
deno = "latest"
node = "latest"
biome = "latest"

uv = "latest"
python = "latest"
ruff = "latest"
ty = "latest"

typst = "latest"
typstyle = "latest"
tinymist = "latest"
