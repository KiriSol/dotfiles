"github:jorgsowa/php-lsp" = "latest"
"github:quarylabs/sqruff" = "latest"
"github:tree-sitter-perl/perl-lsp" = "latest"
"cargo:kdl-lsp" = "latest"
"cargo:psfmt" = "latest"

typos = "latest"
