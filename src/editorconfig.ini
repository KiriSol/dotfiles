### Global editorconfig

root = true

[*]
charset = utf-8
end_of_line = lf
indent_size = 2
indent_style = space
insert_final_newline = true
tab_width = 4
trim_trailing_whitespace = true

## Changes

[*.md]
trim_trailing_whitespace = false

[*.{rs,zig}]
indent_size = 4

[*.{cs,java,kt,swift}]
indent_size = 4

[*.{php,py}]
indent_size = 4

[*.{fish,nu,nuon,ps1,psd1,psm1}]
indent_size = 4

[{justfile,*.just}]
indent_size = 4

[*.kdl]
indent_size = 4

[*.go]
indent_size = 4
indent_style = tab

[{Makefile,*.mk}]
indent_size = 4
indent_style = tab

[{.git{attributes,config,ignore,modules},.config/git/{attributes,config,ignore}}]
indent_size = 4
indent_style = tab

## Tools

# Shfmt
[*.{sh,bash}]
binary_next_line = true
space_redirects = true
switch_case_indent = true
