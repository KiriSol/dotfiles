- defaults:
    link:
      relink: true
      create: true
      force: true
      type: symlink

- clean: ["~", "~/.config", "~/.local/bin"]

- link:
    # Editorconfig
    ~/.editorconfig: editorconfig.ini

    # Config dir
    ~/.config/:
      glob: true
      path: config/*

    # Bash
    ~/.bashrc:
      if: "command -v bash"
      path: bashrc.bash
